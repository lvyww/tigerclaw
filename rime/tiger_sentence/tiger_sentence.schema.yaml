# encoding: utf-8
schema:
  schema_id: tiger_sentence
  name: 虎整句
  version: "1.0"
  author:
    - TigerClaw
  description: |
    从虎整句常用字词表生成的变长整句方案。
    检索码表在 lua/tiger_sentence_lexicon*.lua，不使用 Rime 词典文件。
    自定义编码请改 lua/tiger_sentence_custom.lua 后重新部署。
    整段不超过 4 码时检索该码位全部字词，首选排在非首选前面；
    超过 4 码后光秃编码只取第 1 候选。分号/引号/数字写入编码选重。
    首次输入时用 Lua 优先分页加载 sentence-ngram-mobile.bin 做 Kneser-Ney 打分。

switches:
  - name: ascii_mode
    reset: 0
    states: [ 中文, 西文 ]
  - name: ascii_punct
    states: [ 。，, ．， ]
  - name: full_shape
    states: [ 半角, 全角 ]
  - name: tiger_sentence_early_commit
    reset: 1
    states: [ 提前上屏关, 提前上屏开 ]
engine:
  processors:
    - ascii_composer
    - recognizer
    - key_binder
    - lua_processor@tiger_sentence_processor
    - speller
    - punctuator
    - selector
    - navigator
    - express_editor
  segmentors:
    - abc_segmentor
    - punct_segmentor
    - fallback_segmentor
  translators:
    - punct_translator
    - lua_translator@tiger_sentence_translator

speller:
  alphabet: "zyxwvutsrqponmlkjihgfedcba;';0123456789"
  initials: "abcdefghijklmnopqrstuvwxyz"
  delimiter: " "
  auto_select: false

menu:
  page_size: 5

key_binder:
  bindings:
    - { when: has_menu, accept: Tab, send: Down }
    - { when: has_menu, accept: Shift+Tab, send: Up }
    - { when: paging, accept: minus, send: Page_Up }
    - { when: has_menu, accept: equal, send: Page_Down }

punctuator:
  import_preset: default

recognizer:
  import_preset: default

ascii_composer:
  good_old_caps_lock: true
  switch_key:
    Caps_Lock: clear
    Shift_L: commit_code
    Shift_R: commit_code
    Control_L: noop
    Control_R: noop
