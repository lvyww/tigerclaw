name: Apply reviewed Native history patch
on:
  push:
    branches: [feat/candidate-orientation-memory]
    paths: [.github/workflows/apply-native-history.yml, 'tools/native-history-part*.txt']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
      - name: Verify and apply exact Native-only patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, hashlib, lzma, os, pathlib
          encoded = b''.join(pathlib.Path(f'tools/native-history-part{i}.txt').read_bytes() for i in range(4))
          patch = lzma.decompress(base64.b64decode(encoded, validate=True))
          assert hashlib.sha256(patch).hexdigest() == 'd5ae2934706c5249c784461bde2f0feeb0022327a915f7e6410a01763e810c4e'
          pathlib.Path(os.environ['RUNNER_TEMP'], 'native-history.patch').write_bytes(patch)
          PY
          git merge-base --is-ancestor 538096b776778f0d9e8d7e3a9cf2f06481fb75be HEAD
          git read-tree --reset -u 538096b776778f0d9e8d7e3a9cf2f06481fb75be
          git apply --index "$RUNNER_TEMP/native-history.patch"
          git diff --cached --check
          python3 - <<'PY'
          import subprocess
          paths = subprocess.check_output(['git','diff','--cached','--name-only','538096b776778f0d9e8d7e3a9cf2f06481fb75be'], text=True).splitlines()
          assert len(paths) == 11, paths
          assert all(p.startswith('next/TigerClaw.Overlay.Native/') or p in ['AGENTS.md','.github/workflows/candidate-orientation.yml','tools/test_native_orientation.py'] for p in paths), paths
          print('\n'.join(paths))
          PY
          python3 tools/test_native_orientation.py --cxx g++
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Implement Native-only 100-placement direction history; remove superseded context protocol changes'
          git push origin HEAD:feat/candidate-orientation-memory
