name: Apply candidate publication cache repair
on:
  push:
    branches: [feat/candidate-orientation-memory]
    paths: ['.github/workflows/candidate-cache-fix.yml']
permissions:
  contents: write
jobs:
  repair:
    if: github.repository == 'lvyww/tigerclaw'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('next/TigerClaw.Overlay.Native/main.cpp')
          s = p.read_text()
          old = '            bool reformat = force || !SameDisplayContent(state_, renderedState_) || reveal_.NextDelay(state_, now) != 0;'
          assert s.count(old) == 1, 'Unexpected cache gate; refuse to edit'
          new = '''            // A failed/superseded publication can leave display_ prepared for an
                      // unaccepted state while renderedState_ still describes an older one.
                      // Reformat whenever no current frame is accepted, even if the new
                      // input happens to equal that older renderedState_ (A -> B -> A).
                      bool reformat = force || !candidateDrawn_ || !SameDisplayContent(state_, renderedState_) || reveal_.NextDelay(state_, now) != 0;'''
          p.write_text(s.replace(old, new))
          PY
          git add next/TigerClaw.Overlay.Native/main.cpp
          git rm .github/workflows/candidate-cache-fix.yml
          git -c core.whitespace=cr-at-eol diff --cached --check
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Reformat after superseded publication so stale expanded content cannot teach the next frame a false above direction'
          git push origin HEAD:refs/heads/feat/candidate-orientation-memory
