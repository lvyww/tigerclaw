name: Candidate source snapshot
on:
  push:
    branches: [feat/candidate-orientation-memory]
    paths: ['.github/workflows/candidate-source-snapshot.yml']
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: |
          git bundle create candidate-source.bundle refs/remotes/origin/main refs/remotes/origin/feat/candidate-orientation-memory
          git show-ref > snapshot-refs.txt
      - uses: actions/upload-artifact@v4
        with:
          name: candidate-history-snapshot
          path: |
            candidate-source.bundle
            snapshot-refs.txt
          retention-days: 1
