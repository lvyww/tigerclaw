name: Pending candidate frame regression
on:
  pull_request:
    branches: [main]
    paths: ['next/TigerClaw.Core/**', 'next/TigerClaw.Shared/**', 'next/TigerClaw.Overlay.Native/**', 'tests/TigerClaw.CandidateFrame.Tests/**', '.github/workflows/pending-candidate-frame.yml']
  push:
    branches: [main]
    paths: ['next/TigerClaw.Core/**', 'next/TigerClaw.Shared/**', 'next/TigerClaw.Overlay.Native/**', 'tests/TigerClaw.CandidateFrame.Tests/**', '.github/workflows/pending-candidate-frame.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pending-candidate-frame-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    name: Pending frame Windows ${{ matrix.arch }}
    runs-on: windows-2025
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, x86]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'
      - name: Real Core auto-commit snapshots and native frame retention
        shell: pwsh
        env:
          TEST_ARCH: ${{ matrix.arch }}
        run: |
          $ErrorActionPreference = 'Stop'
          $trace = Join-Path $env:RUNNER_TEMP "candidate-frame-$env:TEST_ARCH.jsonl"
          dotnet run --project tests/TigerClaw.CandidateFrame.Tests -c Release -p:PublishAot=false -- $trace
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet run --project next/TigerClaw.Core.Tests -c Release -p:PublishAot=false
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (!$vs) { throw 'MSVC unavailable' }
          Import-Module "$vs\Common7\Tools\Microsoft.VisualStudio.DevShell.dll"
          Enter-VsDevShell -VsInstallPath $vs -SkipAutomaticLocation -DevCmdArguments "-arch=$env:TEST_ARCH -host_arch=x64"
          $build = Join-Path $env:RUNNER_TEMP "pending-overlay-$env:TEST_ARCH"
          cmake -S next/TigerClaw.Overlay.Native -B $build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build $build --parallel 2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ctest --test-dir $build --output-on-failure
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python next/TigerClaw.Overlay.Native/tests/test_pending_frame.py "$build/overlay_pending_frame_tests.exe" $trace
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
