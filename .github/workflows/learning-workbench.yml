name: Learning implementation workspace
on:
  push:
    branches: [feat/tab-learning-20260913]
    paths: [.github/workflows/learning-workbench.yml, .learning-patch.py]
permissions:
  contents: write
jobs:
  workspace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/tab-learning-20260913
      - name: Apply reviewed implementation patch
        run: |
          if test -f .learning-patch.py; then
            python3 .learning-patch.py
            git add -A
            if ! git diff --cached --quiet; then
              git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'feat: apply reviewed Tab learning implementation'
              git push origin HEAD:feat/tab-learning-20260913
            fi
          fi
      - name: Export workspace
        run: git archive --format=tar.gz -o /tmp/learning-source.tar.gz HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: learning-source
          path: /tmp/learning-source.tar.gz
          retention-days: 1
