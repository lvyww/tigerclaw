name: Candidate orientation
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: candidate-orientation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  geometry:
    name: Portable production geometry
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '10.0.x'
      - run: python3 tools/test_candidate_orientation.py
      - run: python3 tools/test_native_orientation.py --cxx clang++ --sanitize
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
  windows:
    name: Windows ${{ matrix.platform }} WPF
    runs-on: windows-2025
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        platform: [x64, x86]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '10.0.x'
      - name: Build actual Overlay and Dialog
        shell: pwsh
        run: |
          dotnet build next/TigerClaw.Overlay/TigerClaw.Overlay.csproj -c Release --artifacts-path "$env:RUNNER_TEMP/production-overlay" -p:PlatformTarget=${{ matrix.platform }} --nologo
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet build next/TigerClaw.Dialog/TigerClaw.Dialog.csproj -c Release --artifacts-path "$env:RUNNER_TEMP/production-dialog" -p:PlatformTarget=${{ matrix.platform }} --nologo
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build TSF bridge with context-change notification
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.Component.MSBuild -property installationPath
          if (!$vs) { throw 'MSBuild unavailable' }
          $platform = if ('${{ matrix.platform }}' -eq 'x86') { 'Win32' } else { 'x64' }
          & "$vs\MSBuild\Current\Bin\MSBuild.exe" BimeTSF2/SampleIME/BimeTSF2.vcxproj /nr:false /p:Configuration=Release "/p:Platform=$platform" /p:PlatformToolset=v145 /p:WholeProgramOptimization=false "/p:OutDir=$env:RUNNER_TEMP\bridge\" "/p:IntDir=$env:RUNNER_TEMP\bridge-obj\" /v:minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Geometry, WPF publication and negative controls
        shell: pwsh
        run: |
          python tools/test_candidate_orientation.py --windows-ui --platform ${{ matrix.platform }}
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Real Core protocol and existing Core regressions
        if: matrix.platform == 'x64'
        shell: pwsh
        run: |
          python tools/test_candidate_orientation.py --protocol
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet build next/TigerClaw.Core.Tests/TigerClaw.Core.Tests.csproj -c Release --artifacts-path "$env:RUNNER_TEMP/core-tests" -p:PublishAot=false --nologo
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $tests = @(Get-ChildItem "$env:RUNNER_TEMP/core-tests/bin/TigerClaw.Core.Tests" -Recurse -Filter TigerClaw.Core.Tests.dll)
          if ($tests.Count -ne 1) { throw 'Expected exactly one Core test binary' }
          dotnet $tests[0].FullName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
  native:
    name: Windows ${{ matrix.platform }} Native
    runs-on: windows-2025
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        platform: [x64, Win32]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          submodules: true
      - name: Build actual Native Overlay and isolated probes
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (!$vs) { throw 'MSVC unavailable' }
          Import-Module "$vs\Common7\Tools\Microsoft.VisualStudio.DevShell.dll"
          $arch = if ('${{ matrix.platform }}' -eq 'Win32') { 'x86' } else { 'x64' }
          Enter-VsDevShell -VsInstallPath $vs -SkipAutomaticLocation -DevCmdArguments "-arch=$arch -host_arch=x64"
          python tools/test_native_orientation.py --cxx cl
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $cmake = "$vs\Common7\IDE\CommonExtensions\Microsoft\CMake\CMake\bin\cmake.exe"
          if (!(Test-Path $cmake)) { $cmake = (Get-Command cmake.exe).Source }
          & $cmake -S next/TigerClaw.Overlay.Native -B "$env:RUNNER_TEMP/native-build" -G "Visual Studio 18 2026" -A ${{ matrix.platform }} "-DCMAKE_GENERATOR_INSTANCE=$vs"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $cmake --build "$env:RUNNER_TEMP/native-build" --config Release -j 4
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Model, transport, publication and real isolated executable IPC
        shell: pwsh
        run: |
          ctest --test-dir "$env:RUNNER_TEMP/native-build" -C Release --output-on-failure
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$env:RUNNER_TEMP/native-build/Release/overlay_orientation_publication.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$env:RUNNER_TEMP/native-build/Release/overlay_window_tests.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
