name: Apply native candidate orientation sources
on:
  push:
    branches: [feat/candidate-orientation-memory]
    paths:
      - '.candidate-native-transfer/**'
      - '.github/workflows/candidate-native-apply.yml'
permissions:
  contents: write
jobs:
  apply:
    if: github.repository == 'lvyww/tigerclaw'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Verify and apply exact native source patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, hashlib, pathlib, subprocess, tempfile, zlib
          root = pathlib.Path('.candidate-native-transfer')
          encoded = ''.join((root / ('part' + str(i))).read_text() for i in range(3))
          patch = zlib.decompress(base64.b64decode(encoded, validate=True))
          assert hashlib.sha256(patch).hexdigest() == 'de748c52fa871bf877cf779c196abf7bddee38c7c500aa55223e62313410ab31', 'Source transfer checksum mismatch'
          assert b'diff --git a/.github/' not in patch, 'Workflow changes are not part of source transfer'
          with tempfile.NamedTemporaryFile(suffix='.patch') as file:
              file.write(patch); file.flush()
              subprocess.run(['git', 'apply', '--check', '--index', file.name], check=True)
              subprocess.run(['git', 'apply', '--index', '--whitespace=nowarn', file.name], check=True)
          subprocess.run(['git', '-c', 'core.whitespace=cr-at-eol', 'diff', '--cached', '--check'], check=True)
          PY
          git rm -r .candidate-native-transfer
          git rm .github/workflows/candidate-native-apply.yml
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Add cross-composition direction memory to the current Native Overlay and real publication/IPC regressions'
          git push origin HEAD:refs/heads/feat/candidate-orientation-memory
