name: Apply candidate compiler fixes
on:
  push:
    branches: [feat/candidate-orientation-memory]
    paths: ['.github/workflows/candidate-build-fix.yml']
permissions:
  contents: write
jobs:
  apply:
    if: github.repository == 'lvyww/tigerclaw'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, hashlib, subprocess, tempfile, zlib
          patch = zlib.decompress(base64.b64decode('', validate=True))
          assert hashlib.sha256(patch).hexdigest() == 'cf8c2190a83150cde5e79cfd9d009f0bdfedbbe3275d320e522f2cf827178333'
          with tempfile.NamedTemporaryFile() as file:
              file.write(patch);file.flush()
              subprocess.run(['git','apply','--check','--index',file.name],check=True)
              subprocess.run(['git','apply','--index',file.name],check=True)
          PY
          git rm .github/workflows/candidate-build-fix.yml
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Include PipeClient definition and match Windows SDK publication test signature'
          git push origin HEAD:refs/heads/feat/candidate-orientation-memory
