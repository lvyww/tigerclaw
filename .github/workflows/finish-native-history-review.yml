name: Finish Native history review
on:
  push:
    branches: [feat/native-placement-history-100]
    paths: [.github/workflows/finish-native-history-review.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Apply exact reviewed changes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib, subprocess
          root = pathlib.Path('next/TigerClaw.Overlay.Native')
          source = root / 'main.cpp'
          tests = root / 'tests/PlacementPublicationTests.cpp'
          assert subprocess.check_output(['git','hash-object',str(source)],text=True).strip() == 'd978a284a3a876a6363cbcbcd4bd85e4fdc0ae87'
          assert subprocess.check_output(['git','hash-object',str(tests)],text=True).strip() == '9abfd2c2225a5258e447c8dd5a98caf25b14c485'
          data = source.read_bytes()
          old = b'bool reformat = force || !SameDisplayContent(state_, renderedState_)'
          assert data.count(old) == 1
          data = data.replace(old, b'bool reformat = force || !candidateDrawn_ || !SameDisplayContent(state_, renderedState_)')
          old = b'AppendMenuW(menu, MF_STRING | (themeNames[i]'
          assert data.count(old) == 1
          data = data.replace(old, b'AppendMenuW(themes, MF_STRING | (themeNames[i]')
          source.write_bytes(data)
          data = tests.read_bytes()
          old = b'        Check(cases==13,"missing publication scenarios");'
          assert data.count(old) == 1
          new = '''        {
                      // A -> B -> A before the queued refresh: B may prepare a
                      // tall display but its superseded publication is not A's cache.
                      PlacementPublicationProbe p;p.Rows(5);
                      duringPresent=[&]{p.Rows(1);p.app.Refresh(false);};
                      p.app.Refresh(false);
                      Check(p.app.placement_.RecordCount()==1,"superseded target recorded");
                      p.app.Refresh(false);p.Below();p.Drain();p.Below();
                      Check(p.app.placement_.EvidenceCount()==0,"superseded tall layout seeded evidence");++cases;
                  }
                  Check(cases==14,"missing publication scenarios");'''
          # Keep indentation aligned with the surrounding source.
          new = new.replace('\n          ', '\n')
          tests.write_bytes(data.replace(old,new.encode()))
          PY
          rm .github/workflows/finish-native-history-review.yml
          git add next/TigerClaw.Overlay.Native/main.cpp next/TigerClaw.Overlay.Native/tests/PlacementPublicationTests.cpp .github/workflows/finish-native-history-review.yml
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Preserve theme submenu and refresh superseded candidate layout before publication'
          git push origin HEAD:feat/native-placement-history-100
